<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for browsers/contexts that ignore SVG favicons. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS renders this opaque and applies its own rounding, so it needs the
         solid-background variant rather than the transparent-corner icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve
         to anything but 0 — without it, every safe-area padding rule in this
         codebase (BottomNav, AppShell, MockTestEngine) was silently inert.
         Matters here specifically because the PWA manifest runs
         display:'standalone' (installed, no browser chrome), where content
         genuinely extends under a notch/Dynamic Island/home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#21A375" />
    <!-- These static tags describe the HOMEPAGE, deliberately. Every route
         serves this same file, and src/lib/seo.js rewrites title, description,
         canonical and OG per route once React runs. Crawlers that execute JS
         see the corrected values; those that do not — Bing's first pass, and
         every social scraper (WhatsApp, LinkedIn, Slack, X) — see these. `/` is
         the URL that actually gets shared, so these stay tuned for it.
         Prerendering (Tier 2) is what makes the per-route values static. -->
    <meta name="description" content="AI exam preparation for NEET, JEE, CBSE and Kerala State board students in India. Unlimited practice, real exam-pattern mock tests, and a tutor that explains." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.easewithexam.com/" />
    <title>NEET, JEE &amp; CBSE Exam Prep with an AI Tutor | EaseWithExam</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.easewithexam.com/" />
    <meta property="og:site_name" content="EaseWithExam" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="NEET, JEE &amp; CBSE Exam Prep with an AI Tutor | EaseWithExam" />
    <meta property="og:description" content="Unlimited AI practice, real exam-pattern mock tests, and a personal AI tutor that actually teaches you — not just answers you. Free to start." />
    <meta property="og:image" content="https://www.easewithexam.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EaseWithExam — AI-powered NEET, JEE and CBSE exam preparation" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEET, JEE &amp; CBSE Exam Prep with an AI Tutor | EaseWithExam" />
    <meta name="twitter:description" content="Unlimited AI practice, real exam-pattern mock tests, and a personal AI tutor that actually teaches you — not just answers you." />
    <meta name="twitter:image" content="https://www.easewithexam.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />

    <!-- Static, so non-JS crawlers and social scrapers still get it. The
         WebSite/SearchAction and FAQPage blocks are injected at runtime by
         src/components/seo/StructuredData.jsx, because they are derived from
         app data (FAQ_FLAT) and would drift if duplicated here.
         `@id` is what lets the runtime graph reference this node. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "@id": "https://www.easewithexam.com/#organization",
      "name": "EaseWithExam",
      "alternateName": "EWE",
      "url": "https://www.easewithexam.com/",
      "logo": "https://www.easewithexam.com/icon-512.png",
      "image": "https://www.easewithexam.com/og-image.png",
      "email": "info@acenzos.com",
      "description": "AI-powered exam preparation platform for NEET, JEE, CBSE and Kerala State board students.",
      "areaServed": { "@type": "Country", "name": "India" },
      "knowsLanguage": "en-IN",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Acenzos",
        "url": "https://acenzos.com"
      },
      "sameAs": ["https://acenzos.com"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
