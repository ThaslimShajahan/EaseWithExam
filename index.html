    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for browsers/contexts that ignore SVG favicons. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS renders this opaque and applies its own rounding, so it needs the
         solid-background variant rather than the transparent-corner icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve
         to anything but 0 — without it, every safe-area padding rule in this
         codebase (BottomNav, AppShell, MockTestEngine) was silently inert.
         Matters here specifically because the PWA manifest runs
         display:'standalone' (installed, no browser chrome), where content
         genuinely extends under a notch/Dynamic Island/home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#21A375" />
