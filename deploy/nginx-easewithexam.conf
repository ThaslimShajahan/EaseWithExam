location ~ ^/(admin|analytics|auth|coaching|coaching-invite|dashboard|doubt|exam-alerts|exam-center|exams|flashcards|goals|help|join|leaderboard|learn|notebook|notifications|onboarding|paper-mode|parent|payment-success|practice|pricing|profile|progress|study|support|syllabus|test)(/|$) {
    try_files $uri /index.html;
